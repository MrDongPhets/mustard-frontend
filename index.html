<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#F5C518" />

    <!-- Primary SEO -->
    <title>MUSTARD Digitals</title>
    <meta name="description" content="MUSTARD Digitals is a creative digital agency specializing in branding, logo design, web design, and digital marketing solutions that help businesses grow online." />
    <meta name="keywords" content="digital agency, branding, logo design, web design, digital marketing, creative studio, MUSTARD Digitals" />
    <meta name="author" content="MUSTARD Digitals" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://mustarddigitals.com/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mustarddigitals.com/" />
    <meta property="og:title" content="MUSTARD Digitals" />
    <meta property="og:description" content="Creative digital agency specializing in branding, logo design, web design, and digital marketing solutions that help businesses grow online." />
    <meta property="og:image" content="https://mustarddigitals.com/favicon.png" />
    <meta property="og:site_name" content="MUSTARD Digitals" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MUSTARD Digitals" />
    <meta name="twitter:description" content="Creative digital agency specializing in branding, logo design, web design, and digital marketing solutions." />
    <meta name="twitter:image" content="https://mustarddigitals.com/favicon.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://mustarddigitals.com/#organization",
          "name": "MUSTARD Digitals",
          "url": "https://mustarddigitals.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://mustarddigitals.com/favicon.png"
          },
          "description": "MUSTARD Digitals is a Philippines-based creative digital agency specializing in branding, logo design, web design, video production, and digital marketing.",
          "address": {
            "@type": "PostalAddress",
            "addressCountry": "PH"
          },
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "@id": "https://mustarddigitals.com/#website",
          "url": "https://mustarddigitals.com/",
          "name": "MUSTARD Digitals",
          "description": "Creative digital agency helping businesses grow through design, web development, and digital marketing.",
          "publisher": {
            "@id": "https://mustarddigitals.com/#organization"
          }
        },
        {
          "@type": "ItemList",
          "name": "MUSTARD Digitals Site Navigation",
          "itemListElement": [
            {
              "@type": "SiteLinksSearchBox",
              "target": "https://mustarddigitals.com/"
            },
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Home",
              "url": "https://mustarddigitals.com/"
            },
            {
              "@type": "ListItem",
              "position": 2,
              "name": "About",
              "description": "Learn about MUSTARD Digitals — our story, values, and the team behind the brand.",
              "url": "https://mustarddigitals.com/about"
            },
            {
              "@type": "ListItem",
              "position": 3,
              "name": "Services",
              "description": "Web design, branding, video editing, content creation, and administrative support.",
              "url": "https://mustarddigitals.com/services"
            },
            {
              "@type": "ListItem",
              "position": 4,
              "name": "Portfolio",
              "description": "Browse our portfolio of branding, web design, and content creation projects.",
              "url": "https://mustarddigitals.com/portfolio"
            },
            {
              "@type": "ListItem",
              "position": 5,
              "name": "Contact",
              "description": "Get in touch with MUSTARD Digitals to start your project or claim your free trial.",
              "url": "https://mustarddigitals.com/contact"
            }
          ]
        }
      ]
    }
    </script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </head>
  <body>
  <script>document.body.setAttribute('data-theme', localStorage.getItem('md-theme') || 'dark');</script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
